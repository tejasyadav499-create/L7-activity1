<html>
<head>
    <title>First css lesson</title>
    <style>
    /* element selectors */
    body{ background-color:powderblue;}
    h1{ color:blue;}
     h2{ color:green}
     p{ color:orange}
    /* id selector */
     #mycard{ background-color:rgb(28, 211, 28); }
     /* class selectors */
     .details{color:royalblue;font-weight:bold;}
     .card{color:maroon;font-style:italic;}
     /* universal selector */
     *{font-size:15px;}
     /* internal css */
    </style>
</head>
<body>
<h1>My colour card</h1>
<!-- inline css -->
 <p style="color:red;">
    hi this is my first css lesson
 </p>
 <div id="mycard">
    <h2>ABOUT ME</h2>
    <P class="details">My name is tejas</P>
<p class="details"> my favourite colour is blue</p>
<p class="card">I live in India</p>
<p class="card">i like ice cream</p>
 </div>
 <h2>
    My favourite things
 </h2>
 <p>favourite games is cricket</p>
 <p>favourite food is pizza</p>
<p>favourite subject is mathematics</p>
<p>favourite movie is 3 idiots</p>
</body>
</html>
